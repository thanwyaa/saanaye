<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>قريباً | منصة الثانوية الرسمية بلس</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Tajawal', sans-serif;
      padding: 20px;
    }

    /* الكارد الرئيسي */
    .card {
      background: #111111;
      border-radius: 48px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid #222;
      box-shadow: 0 25px 40px rgba(0,0,0,0.5);
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: inline-block;
      animation: spin 4s infinite linear;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      color: #f5b041;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .sub {
      color: #888;
      font-size: 15px;
      margin-bottom: 32px;
    }

    /* أنيميشن الكتابة */
    .typing-area {
      background: #1a1a1a;
      padding: 16px 20px;
      border-radius: 60px;
      margin: 24px 0;
      border: 1px solid #2a2a2a;
    }

    .typing-text {
      font-size: 20px;
      font-weight: 800;
      color: #f5b041;
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-left: 3px solid #f5b041;
      animation: typing 2s steps(22, end), blink 0.6s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      0%, 100% { border-color: transparent; }
      50% { border-color: #f5b041; }
    }

    /* شريط التقدم */
    .progress-section {
      margin: 32px 0 28px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #222;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      width: 68%;
      height: 100%;
      background: #f5b041;
      border-radius: 10px;
      animation: progress 1.5s ease infinite alternate;
    }

    @keyframes progress {
      from { width: 65%; }
      to { width: 73%; }
    }

    /* نموذج الإشعار */
    .form-group {
      margin: 16px 0;
    }

    .form-group input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 60px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #f5b041;
    }

    .form-group input::placeholder {
      color: #555;
    }

    .btn {
      width: 100%;
      background: #f5b041;
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 60px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
      transition: 0.2s;
      font-family: 'Tajawal', sans-serif;
    }

    .btn:hover {
      background: #e2a02a;
      transform: scale(1.01);
    }

    .success-msg {
      color: #4ade80;
      font-size: 13px;
      margin-top: 12px;
      display: none;
    }

    .admin-link {
      margin-top: 24px;
      font-size: 12px;
      color: #555;
    }

    .admin-link a {
      color: #f5b041;
      text-decoration: none;
    }

    @media (max-width: 500px) {
      .card { padding: 32px 24px; }
      h1 { font-size: 28px; }
      .typing-text { white-space: normal; animation: none; border-left: none; font-size: 16px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">⚙️</div>
  <h1>تحت التطوير</h1>
  <div class="sub">نعمل على منصة تعليمية متكاملة</div>

  <div class="typing-area">
    <div class="typing-text">⚡ انتظروا العظمة ⚡</div>
  </div>

  <div class="progress-section">
    <div class="progress-label">
      <span>📈 نسبة الإنجاز</span>
      <span>68%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <div class="form-group">
    <input type="text" id="userName" placeholder="الاسم كاملاً">
  </div>
  <div class="form-group">
    <input type="email" id="userEmail" placeholder="البريد الإلكتروني">
  </div>
  <div class="form-group">
    <input type="text" id="userWhatsapp" placeholder="رقم واتساب (اختياري)">
  </div>
  <button class="btn" onclick="registerInterest()">🔔 أبلغني عند الافتتاح</button>
  <div id="successMsg" class="success-msg">✅ تم تسجيل اهتمامك! سنخبرك فوراً</div>
  
  <div class="admin-link">
    <a href="admin.html" target="_blank">📊 دخول لوحة الإدارة</a>
  </div>
</div>

<script>
  function registerInterest() {
    let name = document.getElementById('userName').value.trim();
    let email = document.getElementById('userEmail').value.trim();
    let whatsapp = document.getElementById('userWhatsapp').value.trim();

    if (!name || !email) {
      alert('❌ من فضلك أدخل الاسم والبريد الإلكتروني');
      return;
    }

    if (!email.includes('@')) {
      alert('❌ أدخل بريداً إلكترونياً صحيحاً');
      return;
    }

    let waitingList = JSON.parse(localStorage.getItem('waitingList')) || [];
    waitingList.push({
      id: Date.now(),
      name: name,
      email: email,
      whatsapp: whatsapp || 'غير مدخل',
      date: new Date().toLocaleString('ar-EG')
    });
    localStorage.setItem('waitingList', JSON.stringify(waitingList));

    let msg = document.getElementById('successMsg');
    msg.style.display = 'block';
    document.getElementById('userName').value = '';
    document.getElementById('userEmail').value = '';
    document.getElementById('userWhatsapp').value = '';

    setTimeout(() => { msg.style.display = 'none'; }, 4000);
  }
</script>

</body>
</html>
