<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً | منصة الثانوية الرسمية بلس</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0a0a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;padding:20px;}
        .card{background:#111;border-radius:48px;padding:40px 32px;max-width:480px;width:100%;text-align:center;border:1px solid #222;}
        .icon{font-size:56px;margin-bottom:16px;display:inline-block;animation:spin 3s infinite linear;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        h1{font-size:30px;font-weight:800;color:#f5b041;margin-bottom:8px;}
        .sub{color:#777;font-size:13px;margin-bottom:24px;}
        .typing-area{background:#1a1a1a;padding:12px 16px;border-radius:50px;margin:20px 0;border:1px solid #2a2a2a;}
        .typing-text{font-size:17px;font-weight:700;color:#f5b041;display:inline-block;overflow:hidden;white-space:nowrap;border-left:3px solid #f5b041;animation:typing 2s steps(20,end),blink 0.6s step-end infinite;}
        @keyframes typing{from{width:0;}to{width:100%;}}
        @keyframes blink{0%,100%{border-color:transparent;}50%{border-color:#f5b041;}}
        .progress-section{margin:28px 0 30px;}
        .progress-label{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin-bottom:6px;}
        .progress-bar{width:100%;height:5px;background:#222;border-radius:10px;overflow:hidden;}
        .progress-fill{width:73%;height:100%;background:#f5b041;border-radius:10px;animation:progress 1.5s ease infinite alternate;}
        @keyframes progress{from{width:70%;}to{width:76%;}}
        .notify-text{color:#ccc;font-size:14px;margin:18px 0 12px;}
        .form-group{margin:12px 0;}
        .form-group input{width:100%;padding:14px 18px;border-radius:60px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff;font-size:14px;outline:none;}
        .form-group input:focus{border-color:#f5b041;}
        .btn{width:100%;background:#f5b041;color:#000;border:none;padding:14px;border-radius:60px;font-weight:700;font-size:15px;cursor:pointer;margin-top:12px;}
        .btn:hover{background:#e2a02a;}
        .msg{padding:12px;border-radius:60px;font-size:13px;margin-bottom:12px;display:none;}
        .error{background:#dc262620;border:1px solid #dc2626;color:#f87171;}
        .success{background:#4ade8020;border:1px solid #4ade80;color:#4ade80;}
        .warning{background:#f5b04120;border:1px solid #f5b041;color:#f5b041;}
        @media (max-width:500px){.card{padding:28px 20px;}h1{font-size:24px;}}
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⚙️</div>
    <h1>قريباً جداً</h1>
    <div class="sub">منصة تعليمية متكاملة</div>
    <div class="typing-area"><div class="typing-text">⚡ انتظروا العظمة ⚡</div></div>
    <div class="progress-section"><div class="progress-label"><span>نسبة الإنجاز</span><span>73%</span></div><div class="progress-bar"><div class="progress-fill"></div></div></div>
    <div class="notify-text">✨ اكتب بياناتك واحنا نوصلك رسالة ✨</div>
    <div id="errorMsg" class="msg error"></div>
    <div id="successMsg" class="msg success"></div>
    <div id="warningMsg" class="msg warning"></div>
    <div class="form-group"><input type="text" id="userName" placeholder="الاسم بالكامل"></div>
    <div class="form-group"><input type="tel" id="userPhone" placeholder="رقم الهاتف (مثال: 01012345678)"></div>
    <button class="btn" onclick="register()">🔔 أبلغني عند الافتتاح</button>
</div>

<script>
    // قاعدة البيانات المؤقتة (هتتخزن في LocalStorage)
    let students = JSON.parse(localStorage.getItem('students_platform')) || [];

    function showMessage(elementId, msg) {
        const div = document.getElementById(elementId);
        div.textContent = msg;
        div.style.display = 'block';
        setTimeout(() => div.style.display = 'none', 4000);
    }

    function validatePhone(phone) {
        let clean = phone.replace(/[^\d]/g, '');
        const arabic = /[٠١٢٣٤٥٦٧٨٩]/g;
        if(arabic.test(clean)) {
            clean = clean.replace(/[٠١٢٣٤٥٦٧٨٩]/g, d => d.charCodeAt(0) - 1632);
        }
        if(clean.length !== 11) return { valid: false, msg: 'رقم الهاتف يجب أن يكون 11 رقم' };
        if(!clean.startsWith('01')) return { valid: false, msg: 'رقم الهاتف يجب أن يبدأ بـ 01' };
        return { valid: true, phone: clean };
    }

    window.register = function() {
        const name = document.getElementById('userName').value.trim();
        let phone = document.getElementById('userPhone').value.trim();

        document.querySelectorAll('.msg').forEach(m => m.style.display = 'none');

        if(!name) { showMessage('errorMsg', '❌ من فضلك اكتب اسمك'); return; }

        const validation = validatePhone(phone);
        if(!validation.valid) { showMessage('errorMsg', validation.msg); return; }
        phone = validation.phone;

        // التحقق من وجود الرقم
        const existing = students.find(s => s.phone === phone);
        if(existing) {
            showMessage('warningMsg', `✅ هذا الرقم ${phone} مسجل بالفعل باسم ${existing.name}\nوجاري مراجعة طلبك`);
            return;
        }

        // تسجيل جديد
        students.push({
            id: Date.now(),
            name: name,
            phone: phone,
            date: new Date().toLocaleString('ar-EG'),
            status: 'pending'
        });
        localStorage.setItem('students_platform', JSON.stringify(students));

        showMessage('successMsg', `✅ تم تسجيل رقمك ${phone} بنجاح!\nجارٍ مراجعة طلبك، هنبلغك فور الافتتاح 🤍`);
        document.getElementById('userName').value = '';
        document.getElementById('userPhone').value = '';
    };
</script>
</body>
</html>
