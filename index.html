
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطوير | منصة تانية ثانوي الرسمية</title>
    <style>
        :root {
            --main-color: #007bff;
            --accent-glow: rgba(0, 123, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0e;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(25, 25, 27, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.1rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .sub-title {
            color: #999;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .cat-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 20px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #efefef;
        }

        .loader-line {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .loader-fill {
            width: 30%;
            height: 100%;
            background: var(--main-color);
            box-shadow: 0 0 10px var(--main-color);
            animation: loading 1.8s infinite ease-in-out;
        }

        @keyframes loading {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(350%); }
        }

        .note {
            font-weight: 600;
            color: var(--main-color);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="container">
        <h1>منصة تانية ثانوي الرسمية</h1>
        <p class="sub-title">الموقع تحت التطوير الشامل حالياً</p>
        
        <div class="categories">
            <span class="cat-tag">ثانوي عام</span>
            <span class="cat-tag">أزهر</span>
        </div>

        <div class="loader-line">
            <div class="loader-fill"></div>
        </div>

        <p class="note">انتظروا المفاجآت قريباً جداً 🔥</p>
        <p style="margin-top: 30px; font-size: 0.8rem; color: #444;">2026 © جميع الحقوق محفوظة</p>
    </div>
</body>
</html>
