<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قريباً | منصة الثانوية الرسمية بلس</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .card {
            background: #111;
            border-radius: 48px;
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 1px solid #222;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 56px;
            margin-bottom: 16px;
            display: inline-block;
            animation: spin 3s infinite linear;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            color: #f5b041;
            margin-bottom: 8px;
        }

        .sub {
            color: #777;
            font-size: 13px;
            margin-bottom: 24px;
        }

        .typing-area {
            background: #1a1a1a;
            padding: 12px 16px;
            border-radius: 50px;
            margin: 20px 0;
            border: 1px solid #2a2a2a;
        }

        .typing-text {
            font-size: 17px;
            font-weight: 700;
            color: #f5b041;
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-left: 3px solid #f5b041;
            animation: typing 2s steps(20, end), blink 0.6s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: #f5b041; }
        }

        .progress-section {
            margin: 28px 0 30px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 12px;
            margin-bottom: 6px;
        }

        .progress-bar {
            width: 100%;
            height: 5px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 73%;
            height: 100%;
            background: #f5b041;
            border-radius: 10px;
            animation: progress 1.5s ease infinite alternate;
        }

        @keyframes progress {
            from { width: 70%; }
            to { width: 76%; }
        }

        .notify-text {
            color: #ccc;
            font-size: 14px;
            margin: 18px 0 12px;
        }

        .form-group {
            margin: 12px 0;
            text-align: right;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            direction: rtl;
        }

        .form-group input:focus {
            border-color: #f5b041;
        }

        .form-group input::placeholder {
            color: #555;
        }

        .error {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #dc2626;
            color: #f87171;
            padding: 12px;
            border-radius: 60px;
            font-size: 13px;
            margin-bottom: 12px;
            display: none;
        }

        .btn {
            width: 100%;
            background: #f5b041;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            background: #e2a02a;
            transform: scale(1.01);
        }

        .success-msg {
            color: #4ade80;
            font-size: 13px;
            margin-top: 14px;
            display: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }
            h1 {
                font-size: 24px;
            }
            .typing-text {
                white-space: normal;
                animation: none;
                border-left: none;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="icon">⚙️</div>
    <h1>قريباً جداً</h1>
    <div class="sub">منصة تعليمية متكاملة بطريقة مختلفة</div>

    <div class="typing-area">
        <div class="typing-text">⚡ انتظروا العظمة ⚡</div>
    </div>

    <div class="progress-section">
        <div class="progress-label">
            <span>نسبة الإنجاز</span>
            <span>73%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="notify-text">
        ✨ عاوز نبلغك أول ما ننزل المنصة؟<br>
        اكتب بياناتك واحنا نوصلك رسالة ✨
    </div>

    <div id="errorMsg" class="error"></div>

    <div class="form-group">
        <input type="text" id="userName" placeholder="الاسم بالكامل (مثال: محمد أحمد)">
    </div>
    <div class="form-group">
        <input type="tel" id="userPhone" placeholder="رقم الهاتف (مثال: 01012345678)">
    </div>

    <button class="btn" onclick="register()">🔔 أبلغني عند الافتتاح</button>
    <div id="successMsg" class="success-msg">✅ تم استلام طلبك! هنبلغك فوراً 🤍</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB3Z8iHqNNfWEWrwIfP15x3hlh65GEZ0mQ",
        authDomain: "sanaayee.firebaseapp.com",
        databaseURL: "https://sanaayee-default-rtdb.firebaseio.com",
        projectId: "sanaayee",
        storageBucket: "sanaayee.firebasestorage.app",
        messagingSenderId: "1048456368002",
        appId: "1:1048456368002:web:e37c8e2b7ebba18ef2499b",
        measurementId: "G-XCYY1H22CQ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.register = async function() {
        const name = document.getElementById('userName').value.trim();
        let phone = document.getElementById('userPhone').value.trim();
        const errorDiv = document.getElementById('errorMsg');
        const successDiv = document.getElementById('successMsg');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        if (!name) {
            showError('❌ من فضلك اكتب اسمك');
            return;
        }

        // تنظيف الرقم من أي مسافات أو أحرف
        let cleanPhone = phone.replace(/[^\d]/g, '');
        
        // تحويل الأرقام العربية إلى أرقام إنجليزية
        const arabicNumbers = /[٠١٢٣٤٥٦٧٨٩]/g;
        if (arabicNumbers.test(cleanPhone)) {
            cleanPhone = cleanPhone.replace(/[٠١٢٣٤٥٦٧٨٩]/g, function(d) {
                return d.charCodeAt(0) - 1632;
            });
        }

        // التحقق من أن الرقم يبدأ بـ 01 ويتكون من 11 رقم
        if (cleanPhone.length !== 11) {
            showError('❌ رقم الهاتف يجب أن يكون 11 رقم بالضبط');
            return;
        }

        if (!cleanPhone.startsWith('01')) {
            showError('❌ رقم الهاتف يجب أن يبدأ بـ 01 (جميع الشبكات المصرية)');
            return;
        }

        phone = cleanPhone;

        try {
            await push(ref(db, 'waitingList'), {
                name: name,
                phone: phone,
                date: new Date().toLocaleString('ar-EG')
            });
            
            successDiv.style.display = 'block';
            document.getElementById('userName').value = '';
            document.getElementById('userPhone').value = '';
            
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 4000);
        } catch (error) {
            showError('حدث خطأ في التسجيل: ' + error.message);
        }
    };

    function showError(msg) {
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        setTimeout(() => {
            errorDiv.style.display = 'none';
        }, 4000);
    }
</script>
</body>
</html>
